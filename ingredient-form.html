<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Yeni İçerik Ekle</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" th:href="@{/products}">Kozmetik Tracker</a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/products}">Ürünler (Product)</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/ingredients}">İçerikler (Ingredient)</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <h2>Yeni İçerik (Aktif Madde) Kaydı</h2>
    <hr>
    <form th:action="@{/ingredients}" th:object="${ingredient}" method="post" style="max-width: 500px;">
        
        <div class="mb-3">
            <label class="form-label">Hangi Ürüne Ait?</label>
            <select th:field="*{product}" class="form-select" required>
                <option value="">Lütfen Bir Ürün Seçin...</option>
                <option th:each="p : ${products}" th:value="${p.id}" th:text="${p.name}"></option>
            </select>
        </div>

        <div class="mb-3">
            <label class="form-label">İçerik Adı (Madde):</label>
            <input type="text" th:field="*{name}" class="form-control" placeholder="Örn: Salisilik Asit" required/>
        </div>
        
        <div class="mb-3">
            <label class="form-label">Amacı / Etkisi:</label>
            <input type="text" th:field="*{purpose}" class="form-control" placeholder="Örn: Gözenek Sıkılaştırıcı"/>
        </div>
        
        <button type="submit" class="btn btn-success">Kaydet</button>
        <a th:href="@{/ingredients}" class="btn btn-secondary">İptal</a>
        
    </form>
</div>
</body>
</html>
