<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>İçerik Listesi</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" th:href="@{/products}">Kozmetik Tracker</a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/products}">Ürünler (Product)</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/ingredients}">İçerikler (Ingredient)</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<div class="container mt-5">
    <h2 class="mb-4">Ürün İçerikleri (Aktif Maddeler)</h2>
    
    <a th:href="@{/ingredients/new}" class="btn btn-primary mb-3">Yeni İçerik Ekle</a>
    <a th:href="@{/products}" class="btn btn-outline-secondary mb-3 ms-2">Ürünlere Dön</a>
    
    <table class="table table-bordered table-striped">
        <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>İçerik Adı</th>
                <th>Amacı (Etkisi)</th>
                <th>Ait Olduğu Ürün</th>
                <th>İşlemler</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="ingredient : ${ingredients}">
                <td th:text="${ingredient.id}">1</td>
                <td th:text="${ingredient.name}">Niacinamide</td>
                <td th:text="${ingredient.purpose}">Leke Giderici</td>
                <td th:text="${ingredient.product.name}">Test Ürünü</td>
                <td>
                    <a th:href="@{/ingredients/delete/{id}(id=${ingredient.id})}" class="btn btn-sm btn-danger" onclick="return confirm('Silmek istediğinize emin misiniz?');">Sil</a>
                </td>
            </tr>
        </tbody>
    </table>
</div>
</body>
</html>
