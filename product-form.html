<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Yeni Ürün Ekle</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" th:href="@{/products}">Kozmetik Tracker</a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/products}">Ürünler (Product)</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/ingredients}">İçerikler (Ingredient)</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <h2>Yeni Cilt Bakım Ürünü Kaydı</h2>
    <hr>
    <form th:action="@{/products}" th:object="${product}" method="post" style="max-width: 500px;">
        
        <div class="mb-3">
            <label class="form-label">Ürün Adı:</label>
            <input type="text" th:field="*{name}" class="form-control" placeholder="Örn: BHA Peeling" required/>
        </div>
        
        <div class="mb-3">
            <label class="form-label">Marka:</label>
            <input type="text" th:field="*{brand}" class="form-control" placeholder="Örn: Cosrx"/>
        </div>
        
        <div class="mb-3">
            <label class="form-label">Kategori:</label>
            <input type="text" th:field="*{category}" class="form-control" placeholder="Örn: Tonik, Temizleyici, Serum"/>
        </div>
        
        <button type="submit" class="btn btn-success">Kaydet</button>
        <a th:href="@{/products}" class="btn btn-secondary">İptal</a>
        
    </form>
</div>
</body>
</html>
