<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Kozmetik Takip - Ürünler</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" th:href="@{/products}">Kozmetik Tracker</a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/products}">Ürünler (Product)</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/ingredients}">İçerikler (Ingredient)</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<div class="container mt-5">
    <h2 class="mb-4">Kozmetik Ürün Listesi</h2>
    
    <a th:href="@{/products/new}" class="btn btn-primary mb-3">Yeni Ürün Ekle</a>
    
    <table class="table table-bordered table-striped">
        <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>Ürün Adı</th>
                <th>Marka</th>
                <th>Kategori</th>
                <th>İçerikler ve Etkileri</th>
                <th>İşlemler</th> 
            </tr>
        </thead>
        <tbody>
            <tr th:each="product : ${products}">
                <td th:text="${product.id}">1</td>
                <td th:text="${product.name}">Niacinamide %10</td>
                <td th:text="${product.brand}">The Purest Solutions</td>
                <td th:text="${product.category}">Serum</td>
                
                <td>
                    <ul class="list-unstyled mb-0" style="font-size: 0.9em;">
                        <li th:each="ing : ${product.ingredients}">
                            <strong th:text="${ing.name}"></strong>: <span th:text="${ing.purpose}" class="text-muted"></span>
                        </li>
                        <li th:if="${#lists.isEmpty(product.ingredients)}" class="text-danger" style="font-style: italic;">
                            Henüz içerik eklenmedi.
                        </li>
                    </ul>
                </td>

                <td>
                    <a th:href="@{/products/edit/{id}(id=${product.id})}" class="btn btn-sm btn-warning">Düzenle</a>
                    <a th:href="@{/products/delete/{id}(id=${product.id})}" class="btn btn-sm btn-danger" onclick="return confirm('Bu ürünü silmek istediğinize emin misiniz?');">Sil</a>
                </td>
            </tr>
        </tbody>
    </table>
</div>
</body>
</html>
